set alert ${recipient}
## monit has no "without authentication" keyword: it parses the token as a second
## mailserver hostname and fails at runtime ("Cannot translate 'authentication' to
## IP address"), while `monit -t` still reports the file as OK. Omitting
## username/password is already unauthenticated, so there is no else-branch.
set mailserver ${server} port ${port}
% if username and password:
	username "${username}"
	password "${password}"
% endif
% if port == 587:
	using tlsv1
% endif
	with timeout 30 seconds
	using hostname localhost.localdomain
set mail-format { from: ${sender} }
