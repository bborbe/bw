# Managed by bundlewrap (bundles/valheim). A hand edit here is reverted by the
# next `bw apply` — change bundles/valheim/files/docker-compose.yml instead.
services:
  valheim:
    # Pinned, not :latest — the image is what decides which Valheim build ships.
    # Bump deliberately. sha-0ab6cdcc16dd == sha256:fde7829b12d39203e155b6209689b70234f8a27d12c4d48baf890cc2ae2c2df3
    image: lloesche/valheim-server:sha-0ab6cdcc16dd
    container_name: valheim-server
    env_file: valheim.env
    # Docker's default grace period is 10s, after which it SIGKILLs the server.
    # A kill mid-save is the one way to corrupt the world, so give the container's
    # own shutdown (save + supervisor stop) room to finish.
    stop_grace_period: 2m
    ports:
      - "2456-2457:2456-2457/udp"
      # crossplay backend port, only used when CROSSPLAY=true
      - "2458:2458/udp"
    volumes:
      - /home/valheim/valheim/data:/config
    restart: unless-stopped
